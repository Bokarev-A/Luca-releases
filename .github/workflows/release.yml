# Luca — desktop release builder.
#
# Place this file in the PUBLIC releases repo (e.g. OWNER/luca-releases) at
# .github/workflows/release.yml. It checks out the PRIVATE source repo, builds
# Windows/macOS/Linux installers with Tauri, signs them, and publishes a PUBLIC
# GitHub Release (with latest.json for the auto-updater).
#
# Replace OWNER/luca with your private code repo.
#
# Secrets to add in the PUBLIC releases repo (Settings → Secrets → Actions):
#   SOURCE_TOKEN                         PAT with read access to the private code repo
#   TAURI_SIGNING_PRIVATE_KEY            contents of src-tauri/.tauri/luca-updater.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD   the key password ("" if none)
#
# Run via Actions → "release" → Run workflow (pick source ref + version).

name: release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref/tag of the private source to build"
        required: true
        default: "main"
      version:
        description: "Release version, e.g. v0.1.0"
        required: true
      linux_only:
        description: "Resume an existing release: build Linux and Android only"
        type: boolean
        default: false
      android_only:
        description: "Resume an existing release: build Android only"
        type: boolean
        default: false

jobs:
  build:
    if: ${{ !inputs.android_only }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.linux_only && '[{"platform":"ubuntu-22.04","args":""}]' || '[{"platform":"macos-latest","args":"--target universal-apple-darwin"},{"platform":"ubuntu-22.04","args":""},{"platform":"windows-latest","args":""}]') }}
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: Bokarev-A/Luca
          ref: ${{ github.event.inputs.ref }}
          token: ${{ secrets.SOURCE_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          # linuxdeploy's bundled strip can reject modern ELF sections and
          # must not rewrite the compiled MCP sidecar.
          NO_STRIP: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.inputs.version }}
          releaseName: "Luca ${{ github.event.inputs.version }}"
          releaseBody: "Автоматическая сборка Luca."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }} --verbose

      - name: Verify connector from packaged AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          LUKA_APPIMAGE=$(find "$GITHUB_WORKSPACE/src-tauri/target/release/bundle/appimage" -maxdepth 1 -name '*.AppImage' -print -quit)
          test -n "$LUKA_APPIMAGE"
          LUKA_CHECK_DIR=$(mktemp -d "$RUNNER_TEMP/luka-appimage-check.XXXXXX")
          cd "$LUKA_CHECK_DIR"
          "$LUKA_APPIMAGE" --appimage-extract > /dev/null
          LUKA_ARCHIVE=$(find squashfs-root -type f -path '*/mcp/luka-mcp.gz' -print -quit)
          test -n "$LUKA_ARCHIVE"
          gzip -dc "$LUKA_ARCHIVE" > "$LUKA_CHECK_DIR/luka-mcp"
          cmp "$LUKA_CHECK_DIR/luka-mcp" "$GITHUB_WORKSPACE/src-tauri/binaries/luka-mcp-x86_64-unknown-linux-gnu"
          chmod 700 "$LUKA_CHECK_DIR/luka-mcp"
          cd "$GITHUB_WORKSPACE"
          npm run verify:mcp -- "$LUKA_CHECK_DIR/luka-mcp"

  # Android — builds a signed universal APK and attaches it to the same release.
  # Needs the desktop job first so the GitHub Release already exists.
  # Extra secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS
  android:
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || inputs.android_only) }}
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: Bokarev-A/Luca
          ref: ${{ github.event.inputs.ref }}
          token: ${{ secrets.SOURCE_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install platform + build-tools + NDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Prepare release signing
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/luca-release.jks"
          {
            echo "password=$KS_PASS"
            echo "keyAlias=$KS_ALIAS"
            echo "storeFile=$RUNNER_TEMP/luca-release.jks"
          } > src-tauri/gen/android/keystore.properties

      - name: Build signed APK
        run: npm run tauri -- android build --apk

      - name: Upload APK to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find src-tauri/gen/android/app/build/outputs/apk/universal/release -name "*.apk" | head -1)
          OUT="Luca_${{ github.event.inputs.version }}_universal.apk"
          cp "$APK" "$OUT"
          gh release upload "${{ github.event.inputs.version }}" "$OUT" --clobber --repo "${{ github.repository }}"
